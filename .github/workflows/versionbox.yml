name: VersionBox — sync and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [versionbox-publish]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: versionbox-publish
  cancel-in-progress: false

jobs:
  versionbox:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Snapshot new versions
        run: python3 versionbox/sync.py
      - name: Save version archive to Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versionbox/data.json versionbox/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "chore(versionbox): archive published builds [skip ci]"
            git push
          fi
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website with all versions
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
