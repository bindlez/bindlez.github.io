<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDO Vision Lite — Sample Demo</title><body style="margin:0;background:#0b0a10"><div id="bdo-lite-demo">
<header><div><strong>✦ BDO VISION</strong><small>LITE / CRAFT COMPANION / 1.1</small></div><span>INTERACTIVE DEMO</span></header>
<section><div class="caption">UTENSIL DURABILITY <span id="reading-state">NO READING</span></div><div id="durability">— / 3,000</div><progress max="3000" value="0" aria-label="Sample utensil durability"></progress><div class="metrics"><div><small>TIME REMAINING</small><b id="time">--:--:--</b></div><div><small>EARLY WARNING IN</small><b id="warning">--:--:--</b></div></div></section>
<small class="heading">CRAFT CONTROLS</small><div class="actions"><button class="primary cursor-interaction" id="scan">Scan sample & track</button><button class="cursor-interaction" id="send" disabled>Send sample</button><button class="cursor-interaction" id="pause" disabled>Pause demo</button><button class="cursor-interaction" id="reset">Reset demo</button></div>
<p id="status" role="status" aria-live="polite">Sample mode · no game capture or planner connection.</p><footer>DEMO ONLY · Windows OCR, shortcuts, and tray controls require the local app.</footer>
</div>
<style>
#bdo-lite-demo{max-width:600px;margin:auto;background:#0b0a10;color:#faf7ff;padding:28px;font:14px 'Segoe UI',sans-serif;box-sizing:border-box}#bdo-lite-demo *{box-sizing:border-box}#bdo-lite-demo header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}#bdo-lite-demo strong{font-size:25px;font-weight:600}#bdo-lite-demo small{display:block;color:#b1a8c2;font-size:11px;letter-spacing:1px}#bdo-lite-demo header span{color:#d5baff;font-size:11px}#bdo-lite-demo section{background:#15131e;border:1px solid #393047;padding:22px}#bdo-lite-demo .caption{font-size:11px;color:#d1c9df;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#bdo-lite-demo #reading-state{color:#d5baff}#bdo-lite-demo #durability{font-size:48px;font-weight:600;margin:14px 0;font-variant-numeric:tabular-nums}#bdo-lite-demo progress{width:100%;height:8px;accent-color:#a879f1;display:block;border:0}#bdo-lite-demo progress::-webkit-progress-bar{background:#211c30}#bdo-lite-demo progress::-webkit-progress-value{background:#a879f1}#bdo-lite-demo .metrics{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px}#bdo-lite-demo .metrics>div{flex:1;min-width:160px}#bdo-lite-demo b{display:block;font:26px Consolas,monospace;margin-top:8px;color:#d5baff}#bdo-lite-demo .heading{margin:24px 0 10px}#bdo-lite-demo .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#bdo-lite-demo button{background:#211c30;border:1px solid #393047;color:#faf7ff;padding:15px 10px;font:600 13px 'Segoe UI',sans-serif;min-height:46px}#bdo-lite-demo button.primary{background:#7744d4}#bdo-lite-demo button:hover:enabled{background:#6636bb}#bdo-lite-demo button:disabled{color:#b1a8c2;opacity:.6}#bdo-lite-demo p{color:#d1c9df;min-height:42px;line-height:1.6}#bdo-lite-demo footer{border-top:1px solid #393047;padding-top:16px;color:#b1a8c2;line-height:1.6;font-size:12px}@media(max-width:420px){#bdo-lite-demo{padding:18px}#bdo-lite-demo #durability{font-size:36px}#bdo-lite-demo .actions{grid-template-columns:1fr}}
</style>
<script>
(()=>{const root=document.getElementById('bdo-lite-demo'),q=s=>root.querySelector(s);let value=0,running=false,hasReading=false;const fmt=n=>{n=Math.max(0,Math.ceil(n));return [Math.floor(n/3600),Math.floor(n%3600/60),n%60].map(x=>String(x).padStart(2,'0')).join(':')};function draw(){q('#durability').textContent=hasReading?value.toLocaleString()+' / 3,000':'— / 3,000';q('progress').value=value;q('#time').textContent=hasReading?fmt(value):'--:--:--';q('#warning').textContent=hasReading?fmt(value-30):'--:--:--';q('#reading-state').textContent=running?'SAMPLE ESTIMATE':hasReading?'DEMO PAUSED':'NO READING';q('#send').disabled=!hasReading;q('#pause').disabled=!hasReading;q('#pause').textContent=running?'Pause demo':'Resume demo'}q('#scan').onclick=()=>{value=1350;hasReading=true;running=true;draw();q('#status').textContent='Sample loaded: 1,350 / 3,000 · 1 second per craft. No live OCR.'};q('#send').onclick=()=>{q('#status').textContent='Simulated planner acknowledgment · '+value.toLocaleString()+' durability. No data sent.'};q('#pause').onclick=()=>{running=!running;draw()};q('#reset').onclick=()=>{value=0;running=false;hasReading=false;draw();q('#status').textContent='Sample mode · no game capture or planner connection.'};setInterval(()=>{if(running&&value>0){value--;if(!value)running=false;draw()}},1000);draw()})();
</script>
</body></html>
